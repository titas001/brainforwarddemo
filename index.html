<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brain Forward App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>/*
VOICE: calm, weightless, premium — a learning app that feels like breathing room for the mind.
IDEA: "Mind in Bloom" — the learner floats inside a porcelain brain lit by the logo's six colours.
PICTURE: a glossy white sculpted brain with an iridescent halo and a live glass score chip.
COLOUR and TYPE: porcelain white + frosted glass, ink navy text, the six logo hues as skill accents; Hind Siliguri + Plus Jakarta Sans.
LAYOUT: phone frame centred on an aurora stage; side rail with role picker and guide on wide screens.
*/
:root{color-scheme:light;--red:#E4414B;--org:#F47920;--yel:#FFC805;--teal:#1FA39A;--sky:#3CB4E7;--blue:#2D7FC1;--ink:#1E3A5F;
--bg:#F5F7FB;--glass:rgba(255,255,255,.58);--glass2:rgba(255,255,255,.78);--line:rgba(255,255,255,.85);--sub:#5B6B84;--mute:#8A97AB;--card-sh:0 18px 50px rgba(30,58,95,.09);
--grad:linear-gradient(110deg,#E4414B,#F47920 22%,#FFC805 42%,#1FA39A 64%,#3CB4E7 82%,#2D7FC1);--ok:#139A72;--bad:#D6364A;--warn:#C98A00}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:15px/1.55 "Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;background:#EEF1F7;color:var(--ink);overflow:hidden}
:lang(bn),.bn{font-family:"Hind Siliguri","Plus Jakarta Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:40px;padding:20px;overflow:hidden}
.aur{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:drift 30s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate(60px,-40px) scale(1.15)}}
.rail{width:300px;max-height:92vh;overflow:auto;position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}
.rail .glass{padding:18px}
.rail h1{font-size:22px;line-height:1.15;margin:6px 0 4px}
.rail p{margin:0;color:var(--sub);font-size:13px}
.phone{position:relative;z-index:2;width:390px;height:min(844px,94vh);border-radius:54px;padding:12px;background:linear-gradient(145deg,#fff,#dfe5ee);box-shadow:0 40px 90px rgba(30,58,95,.25),inset 0 0 0 1px #fff}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg)}
.app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);transition:background .3s}
.app .aur{opacity:.55}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:700;position:relative;z-index:5}
.notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#0c1424}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:3;padding:4px 18px 110px;scroll-behavior:smooth;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.nodock{padding-bottom:30px}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);border-radius:24px;box-shadow:var(--card-sh);position:relative}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(255,255,255,0) 45%);pointer-events:none;opacity:.6}
.glass>*{position:relative}
.card{padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
h2{font-size:24px;line-height:1.15;margin:4px 0 10px;text-wrap:balance}
h3{font-size:17px;line-height:1.25;margin:0 0 6px}
h4{font-size:15px;margin:0}
.sub{color:var(--sub)}.mute{color:var(--mute);font-size:12.5px}.small{font-size:13px}.tiny{font-size:11.5px}.b{font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px}
.sec h3{margin:0}.link{color:var(--blue);font-weight:600;font-size:13px;background:none;border:0;cursor:pointer;padding:6px 0}
.btn{appearance:none;border:0;border-radius:999px;min-height:48px;padding:0 22px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,opacity .2s;font-size:15px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:#fff;box-shadow:0 12px 28px rgba(30,58,95,.28)}
.btn.grad{background:var(--grad);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);box-shadow:0 12px 30px rgba(244,121,32,.3)}
.btn.gh{background:var(--glass2);border:1px solid #fff;color:var(--ink)}
.btn.dan{background:#fff0f1;color:var(--bad)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{width:44px;height:44px;border-radius:16px;border:1px solid #fff;background:var(--glass2);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass2);border:1px solid #fff;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#fff;color:var(--ink)}
.tag.ok{background:#e2f6ef;color:var(--ok)}.tag.bad{background:#fde8ea;color:var(--bad)}.tag.warn{background:#fff4d6;color:#8a6200}.tag.info{background:#e3f1fb;color:var(--blue)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
label.f{display:block;font-size:12.5px;font-weight:700;margin:12px 4px 6px;color:var(--sub)}
.in{width:100%;min-height:50px;border-radius:16px;border:1px solid #fff;background:rgba(255,255,255,.8);padding:12px 14px;font-size:16px;outline:none;transition:box-shadow .2s}
.in:focus{box-shadow:0 0 0 3px rgba(60,180,231,.35)}
.in.err{box-shadow:0 0 0 2px var(--bad)}
.errt{color:var(--bad);font-size:12.5px;margin:6px 4px 0;font-weight:600}
textarea.in{min-height:96px;resize:vertical}
.price{font-weight:800;font-size:18px;white-space:nowrap}.strike{text-decoration:line-through;color:var(--mute);font-size:13px;margin-left:6px;white-space:nowrap}
.off{background:linear-gradient(90deg,#E4414B,#F47920);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.bar{height:8px;border-radius:9px;background:rgba(30,58,95,.08);overflow:hidden}.bar>i{display:block;height:100%;border-radius:9px;background:var(--grad)}
/* dock */
.dock{position:absolute;left:14px;right:14px;bottom:16px;height:72px;z-index:8;display:flex;align-items:center;justify-content:space-around;padding:0 6px;border-radius:28px}
.dock button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mute);cursor:pointer;width:62px;padding:6px 0}
.dock button svg{width:22px;height:22px}
.dock button.on{color:var(--ink)}
.dock .orb{width:62px;height:62px;border-radius:50%;margin-top:-34px;background:var(--grad);color:#fff;box-shadow:0 12px 28px rgba(244,121,32,.4),inset 0 2px 6px rgba(255,255,255,.6);justify-content:center}
.dock .orb svg{width:26px;height:26px}
/* top bar */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.top h2{margin:0;font-size:20px;flex:1}
/* brain hero */
.hero{position:relative;height:250px;display:grid;place-items:center;margin:0 -18px}
.halo{position:absolute;width:236px;height:236px;border-radius:50%;background:conic-gradient(from 0deg,rgba(228,65,75,.35),rgba(255,200,5,.35),rgba(31,163,154,.3),rgba(60,180,231,.35),rgba(45,127,193,.3),rgba(228,65,75,.35));filter:blur(18px);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{position:absolute;width:250px;height:250px;border-radius:50%;border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 0 40px rgba(255,255,255,.6)}
.pbrain{position:relative;width:210px;filter:drop-shadow(0 24px 30px rgba(30,58,95,.18));animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.chipc{position:absolute;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border:1px solid #fff;box-shadow:0 10px 30px rgba(30,58,95,.15)}
.chipc b{font-size:26px;display:block;line-height:1}
.chipc span{font-size:10px;color:var(--sub);font-weight:700}
.float{position:absolute;padding:8px 12px;font-size:11.5px;border-radius:16px;display:flex;align-items:center;gap:8px;animation:float 7s ease-in-out infinite}
/* course cards */
.cc{padding:0;overflow:hidden;cursor:pointer;margin-bottom:12px}
.cc .art{height:116px;position:relative;overflow:hidden;display:grid;place-items:center}
.cc .bd{padding:12px 14px 14px}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:4px 18px 12px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs>*{flex:0 0 232px;scroll-snap-align:start}
.facet{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 2px 8px rgba(255,255,255,.55),0 8px 18px rgba(0,0,0,.12)}
.facet svg{width:30px;height:30px}
.lr{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(30,58,95,.06);cursor:pointer}
.lr:last-child{border:0}
.ck{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(30,58,95,.07);font-size:12px;font-weight:800}
.ck.done{background:var(--teal);color:#fff}.ck.lock{background:rgba(30,58,95,.05);color:var(--mute)}
details.acc{border-radius:18px;margin-bottom:8px}
details.acc summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700}
details.acc summary::-webkit-details-marker{display:none}
details.acc .in2{padding:0 16px 10px}
.sticky{position:sticky;bottom:-100px;margin:14px -4px 0;padding:12px 12px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.gw{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.75);border:1.5px solid #fff;cursor:pointer;margin-bottom:8px}
.gw.on{border-color:var(--ink);box-shadow:0 0 0 3px rgba(30,58,95,.08)}
.gl{width:46px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:11px;color:#fff;flex:none;letter-spacing:-.2px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--mute);margin-left:auto;flex:none}
.gw.on .radio{border:6px solid var(--ink)}
.gwframe{border-radius:26px;overflow:hidden;margin-top:6px}
.gwhead{padding:18px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.otpbox{display:flex;gap:8px;justify-content:center;margin:14px 0}
.otpbox input{width:44px;height:54px;text-align:center;font-size:22px;font-weight:800;border-radius:14px;border:1px solid #fff;background:rgba(255,255,255,.85)}
.big{font-size:44px;font-weight:800;line-height:1}
.center{text-align:center}
.sheet{position:absolute;inset:0;z-index:30;background:rgba(15,25,45,.35);display:flex;align-items:flex-end;animation:fade .2s}
.sheet>.glass{width:100%;border-radius:30px 30px 44px 44px;padding:20px 18px 26px;background:rgba(255,255,255,.92);max-height:88%;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes up{from{transform:translateY(40%)}}@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:18px;right:18px;top:52px;z-index:40;padding:12px 16px;border-radius:18px;background:rgba(30,58,95,.92);color:#fff;font-size:13.5px;font-weight:600;animation:up .25s}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;color:var(--mute);font-weight:700;padding:6px 4px;font-size:11px}
.tbl td{padding:8px 4px;border-top:1px solid rgba(30,58,95,.07);vertical-align:top}
.kpi{padding:12px}.kpi b{font-size:20px;display:block}.kpi span{font-size:11px;color:var(--sub);font-weight:600}
.chips>*,.tabs>*,.row>.chip{flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -18px 12px;padding:0 18px 4px;scrollbar-width:none}
.game{height:300px;border-radius:26px;display:grid;place-items:center;position:relative;overflow:hidden;user-select:none}
.tile{border-radius:12px;background:rgba(30,58,95,.08);cursor:pointer;transition:background .2s,transform .1s}
.tile.lit{background:var(--teal);box-shadow:0 0 18px rgba(31,163,154,.6)}
.tile.ok{background:#9fe0c9}.tile.no{background:#f7b3ba}
.cert{aspect-ratio:1.414;border-radius:18px;background:#fff;position:relative;overflow:hidden;padding:18px;box-shadow:0 20px 40px rgba(30,58,95,.15)}
.legal{font-size:11px;color:var(--mute);text-align:center;margin-top:14px}
.empty{text-align:center;padding:30px 10px;color:var(--sub)}
.empty svg{width:90px;height:90px;opacity:.85}
.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(30,58,95,.1);border-top-color:var(--org);animation:spin 1s linear infinite;margin:0 auto}
.skel{border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.9),rgba(255,255,255,.4));background-size:200%;animation:sk 1.2s infinite;height:14px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(900px) rotate(600deg);opacity:.2}}
.switch{width:46px;height:28px;border-radius:20px;background:rgba(30,58,95,.15);position:relative;cursor:pointer;border:0;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch.on{background:var(--teal)}.switch.on::after{left:21px}
.menu .lr{padding:13px 4px}
.ava{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.radar text{font-size:9px;fill:var(--sub);font-weight:700}
/* night */
.app.night{--bg:#0E1626;--glass:rgba(24,36,58,.6);--glass2:rgba(34,50,78,.8);--line:rgba(255,255,255,.08);--ink:#E8EEF8;--sub:#A9B6CA;--mute:#7D8BA2;--card-sh:0 18px 50px rgba(0,0,0,.35)}
.app.night .glass::before{opacity:.06}.app.night>.aur{opacity:.16}.app.night .status{color:#E8EEF8}.app.night .dock{background:rgba(20,30,50,.85)}.app.night .ib{background:rgba(34,50,78,.8);border-color:rgba(255,255,255,.08)}.app.night .chip{background:rgba(34,50,78,.8);border-color:rgba(255,255,255,.08)}.app.night .chipc{background:rgba(24,36,58,.88);border-color:rgba(255,255,255,.12)}.app.night img[alt="Brain Forward"]{background:rgba(255,255,255,.92);border-radius:10px;padding:3px 7px}.app.night .pbrain{filter:drop-shadow(0 24px 30px rgba(0,0,0,.5)) brightness(.92)}.app.night .in,.app.night .gw,.app.night .otpbox input{background:rgba(34,50,78,.85);border-color:rgba(255,255,255,.08)}
.app.night .btn.pri{background:#E8EEF8;color:#0E1626}.app.night .chip.on{background:#E8EEF8;color:#0E1626}
.app.night .sheet>.glass{background:rgba(20,30,50,.96)}.app.night .tag{background:#22324e;color:#E8EEF8}
.app.night .cert{background:#fff;color:#1E3A5F}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media (max-width:1000px){.rail{display:none}}
@media (max-width:500px){.stage{padding:0}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:none}.screen{border-radius:0}.notch,.status{display:none}.app{padding-top:env(safe-area-inset-top)}}

#tourLayer{position:absolute;inset:0;z-index:45;pointer-events:none}
.tspot{position:absolute;border-radius:20px;box-shadow:0 0 0 9999px rgba(10,20,40,.5),0 0 0 3px #FFC805,0 0 28px 6px rgba(255,200,5,.55);transition:all .35s cubic-bezier(.2,.9,.3,1);animation:tpulse 1.8s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 9999px rgba(10,20,40,.5),0 0 0 5px #FFC805,0 0 40px 10px rgba(255,200,5,.4)}}
.tcard{position:absolute;left:12px;right:12px;padding:14px;border-radius:24px;pointer-events:auto;background:rgba(255,255,255,.95)!important;animation:up .3s}
.app.night .tcard{background:rgba(20,30,50,.96)!important}
.tbtn{width:36px;height:36px;border-radius:12px;border:1px solid rgba(30,58,95,.12);background:rgba(255,255,255,.9);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.tbtn.main{background:var(--ink);color:var(--bg);width:44px}.tbtn.txt{font-size:12px;font-weight:800;width:40px}.tbtn[disabled]{opacity:.35}
.app.night .tbtn{background:rgba(34,50,78,.9)}
.tmini{position:absolute;right:12px;bottom:96px;padding:10px 14px;border-radius:999px;pointer-events:auto;cursor:pointer;font-size:12.5px;font-weight:800;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.95)!important}

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
        }
      }

  if(def.auth&&!S.uid){stack.pop();stack.push({name:'login',p:{ret:r}});return render();}
  let html;
  if(def.roles&&!def.roles.includes(role()))html=denied(L('এই অংশে আপনার অ্যাক্সেস নেই।','You don’t have access to this area.'));
  else if(def.noChild&&S.childMode)html=denied(L('চাইল্ড মোডে এই অংশ বন্ধ থাকে।','This area is turned off in child mode.'));
  else html=def.v(r.p||{});
  const sc=view.scrollTop;
  view.innerHTML=(S.childMode&&!def.bare?childBar():'')+html;
  view.className='view'+(def.dock?'':' nodock');
  view.scrollTop=keep?0:0; if(keep===2)view.scrollTop=sc;
  appEl.classList.toggle('night',!!S.night); appEl.lang=S.lang==='bn'?'bn':'en';
  renderDock(def.dock); def.after&&def.after(r.p||{}); renderRail(); save();
}
function denied(msg){return `${topbar(L('অ্যাক্সেস নেই','No access'))}<div class="glass card empty">${I('lock',56)}<h3 style="margin-top:12px">${L('অনুমতি নেই','Permission denied')}</h3><p>${msg}</p><button class="btn pri" data-a="home">${L('হোমে ফিরুন','Go home')}</button></div>`;}
function childBar(){const c=(S.children[S.uid]||[]).find(x=>x.id===S.childMode);return `<div class="glass card row sp" style="padding:10px 14px;background:rgba(255,200,5,.25)"><span class="small b">${L('চাইল্ড মোড','Child mode')}: ${esc(c?.name)}</span><button class="btn sm gh" data-a="exitChild">${L('বের হন','Exit')}</button></div>`;}
function topbar(title,right=''){return `<div class="top"><button class="ib" data-a="back" aria-label="${L('পিছনে','Back')}">${I('back')}</button><h2>${title}</h2>${right}</div>`;}
function renderDock(on){
  if(!on){dockEl.style.display='none';return;} dockEl.style.display='flex';
  let tabs;
  if(isStaff())tabs=[['console','grid',L('কনসোল','Console')],['notifs','bell',L('নোটিফিকেশন','Alerts')],['profile','user',L('প্রোফাইল','Profile')]];
  else tabs=[['home','home',L('হোম','Home')],['courses','book',L('কোর্স','Courses')],['practice','brain',L('অনুশীলন','Practice'),1],['learning','learn',L('আমার শেখা','Learning')],['profile','user',L('প্রোফাইল','Profile')]];
  if(S.childMode)tabs=tabs.filter(t=>t[0]!=='courses');
  dockEl.innerHTML=tabs.map(([r,i,l,orb])=>`<button class="${orb?'orb':''} ${on===r?'on':''}" data-a="tab" data-r="${r}" aria-label="${l}">${I(i)}${orb?'':`<span>${l}</span>`}</button>`).join('');
}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;appEl.appendChild(t);setTimeout(()=>t.remove(),2600);}
function sheet(html){closeSheet();const s=document.createElement('div');s.className='sheet';s.id='sheet';s.innerHTML=`<div class="glass" role="dialog" aria-modal="true">${html}</div>`;s.addEventListener('click',e=>{if(e.target===s)closeSheet();});appEl.appendChild(s);}
function closeSheet(){document.getElementById('sheet')?.remove();}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#E4414B','#F47920','#FFC805','#1FA39A','#3CB4E7','#2D7FC1'];c.innerHTML=Array.from({length:60},(_,i)=>`<i style="left:${Math.random()*100}%;background:${cols[i%6]};animation-delay:${Math.random()*.6}s"></i>`).join('');appEl.appendChild(c);setTimeout(()=>c.remove(),3200);}
const val=id=>(document.getElementById(id)?.value||'').trim();
function fieldErr(id,msg){const el=document.getElementById(id);if(!el)return;el.classList.add('err');let n=el.nextElementSibling;if(!n||!n.classList.contains('errt')){n=document.createElement('div');n.className='errt';el.after(n);}n.textContent=msg;}

function memGame(){const rounds=[[3,3],[4,5],[5,7]];G.mc=0;G.mt=0;let ri=0;const box=document.getElementById('mg'),info=document.getElementById('minfo'),mr=document.getElementById('mr');
 const run=()=>{const [n,k]=rounds[ri];box.style.gridTemplateColumns=`repeat(${n},1fr)`;const lit=new Set();while(lit.size<k)lit.add(Math.floor(Math.random()*n*n));

/* ===== Cart & coupons ===== */
function quote(code){const items=S.cart.map(i=>({...i,c:C(i.cid)}));const sub=items.reduce((a,i)=>a+i.c.price*(i.qty||1),0);let disc=0,err=null,cp=null;
 if(code){cp=S.coupons.find(x=>x.code===code.toUpperCase());const u=me();const paid=u&&S.orders.some(o=>o.uid===u.id&&o.status==='paid');
  if(!cp||!cp.active)err=L('কুপন কোডটি সঠিক নয়','Invalid coupon code');else if(cp.exp<now())err=L('কুপনের মেয়াদ শেষ','This coupon has expired');else if(cp.cap&&cp.used>=cp.cap)err=L('কুপনের ব্যবহার সীমা শেষ','Coupon usage limit reached');
  else if(cp.first&&paid)err=L('শুধু প্রথম কেনাকাটায় প্রযোজ্য','Valid on first purchase only');else if(cp.min&&sub<cp.min)err=L(`ন্যূনতম ${tk(cp.min)} কেনাকাটায় প্রযোজ্য`,`Minimum order ${tk(cp.min)}`);
  else if(cp.type==='bundle'){if(!cp.req.every(r=>items.some(i=>i.cid===r)))err=L('লেভেল ০১, ০২ ও ০৩ একসাথে কার্টে থাকতে হবে','Levels 01, 02 and 03 must all be in the cart');else disc=cp.req.reduce((a,r)=>a+C(r).price,0)-cp.price;}
  else{const elig=items.filter(i=>!cp.scope||cp.scope.includes(i.cid));if(!elig.length)err=L('এই কোর্সে কুপনটি প্রযোজ্য নয়','Coupon doesn’t apply to these courses');else disc=Math.round(elig.reduce((a,i)=>a+i.c.price*(i.qty||1),0)*cp.val/100);}
  if(err){disc=0;cp=null;}}
 const total=Math.max(0,sub-disc);return {items,sub,disc,total,vat:Math.round(total*15/115),err,cp};}

 if(S.scores.guest&&!S.scores[u.id]){S.scores[u.id]=S.scores.guest;}

 toast(L(`স্বাগতম, ${u.name.split(' ')[0]}!`,`Welcome, ${u.name.split(' ')[0]}!`));}

const TOUR_ORDER=TOURS.map(t=>t.id);
function tourDur(st){return Math.max(4200,(L(st.d[0],st.d[1]).length*55))/(TOUR?.speed||1);}
function startTour(id,o={}){const l=S.lang;if(!o.keep){S=seed();S.lang=l;}S.onboarded=true;S.demo=true;PAY=null;closeSheet();
 TOUR={id,i:0,playing:o.play!==false,speed:TOUR?.speed||1,marathon:!!o.marathon,min:false};runStep();}
function tourDef(){return TOURS.find(t=>t.id===TOUR.id);}
function runStep(){clearTimeout(TOUR.timer);clearTimeout(TOUR.pt);const tr=tourDef(),st=tr.steps[TOUR.i];
 try{if(tr.uid&&TOUR.i>=(tr.authFrom||0))asU(tr.uid);st.at&&st.at();}catch(e){console.warn('tour step',e);}
 TOUR.pt=setTimeout(paintTour,st.w||450);}
function schedule(){clearTimeout(TOUR.timer);if(!TOUR.playing)return;const st=tourDef().steps[TOUR.i];TOUR.timer=setTimeout(()=>tourNext(true),tourDur(st));}
function tourNext(auto){if(!TOUR)return;const n=tourDef().steps.length;if(TOUR.i<n-1){TOUR.i++;runStep();}else{if(TOUR.marathon){const k=TOUR_ORDER.indexOf(TOUR.id);if(k<TOUR_ORDER.length-1){startTour(TOUR_ORDER[k+1],{marathon:true,play:TOUR.playing});return;}}TOUR.done=true;TOUR.playing=false;paintTour();}}
function tourPrev(){if(!TOUR||TOUR.i===0)return;TOUR.i--;TOUR.done=false;runStep();}
function endTour(){if(!TOUR)return;clearTimeout(TOUR.timer);clearTimeout(TOUR.pt);TOUR=null;document.getElementById('tourLayer')?.remove();toast(L('গাইডেড ডেমো শেষ — নিজে ঘুরে দেখুন','Guided demo ended — explore on your own'));render(2);}
function paintTour(){if(!TOUR)return;let layer=document.getElementById('tourLayer');if(!layer){layer=document.createElement('div');layer.id='tourLayer';appEl.appendChild(layer);}
 const tr=tourDef(),st=tr.steps[TOUR.i],n=tr.steps.length,u=me();
 const el=st.sel?(st.sel.startsWith('#sheet')?document.querySelector(st.sel):(view.querySelector(st.sel)||appEl.querySelector(st.sel))):null;TOUR.found=!!el;
 if(el&&el.closest('#view')){const vr=view.getBoundingClientRect(),r0=el.getBoundingClientRect();view.scrollTop+=(r0.top-vr.top)-(vr.height/2)+(Math.min(r0.height,vr.height*.5)/2);}appEl.scrollTop=0;appEl.parentElement.scrollTop=0;
 setTimeout(()=>{if(!TOUR)return;const ar=appEl.getBoundingClientRect();let spot='',top=true;
  if(el&&el.isConnected){const r=el.getBoundingClientRect();const x=r.left-ar.left-6,y=r.top-ar.top-6,w=Math.min(r.width+12,ar.width-8),h=Math.min(r.height+12,ar.height*.55);
   spot=`<div class="tspot" style="left:${Math.max(2,x)}px;top:${Math.max(2,y)}px;width:${w}px;height:${h}px"></div>`;top=(y+h/2)>ar.height*.52;}
  else spot=`<div class="tspot" style="left:50%;top:50%;width:0;height:0"></div>`;
  const pct=Math.round((TOUR.i+1)/n*100);
  const card=TOUR.min?`<div class="tmini glass" data-a="tourMin">${I('play',14)} ${N(TOUR.i+1)}/${N(n)} · ${L('গাইড','Guide')}</div>`
  :`<div class="tcard glass" style="${top?'top:50px':'bottom:14px'}" role="dialog" aria-label="Guided demo">
   <div class="row sp" style="gap:6px"><span class="tag" style="background:${tr.col};color:#fff">${I(tr.ico,12)} ${tx(tr.t)}</span><span class="tiny mute">${u?esc(u.name.split(' ')[0])+' · '+tx(ROLES[u.role]):L('অতিথি','Guest')}</span></div>
   <div class="bar" style="height:5px;margin:8px 0"><i style="width:${pct}%"></i></div>
   ${TOUR.done?`<h4 style="margin:4px 0">${L('জার্নি সম্পন্ন!','Journey complete!')}</h4><p class="small sub" style="margin:2px 0 10px">${L('আবার দেখুন, পরের রোলে যান, বা নিজে ঘুরে দেখুন।','Replay, move to the next role, or explore on your own.')}</p>
   <div class="grid3"><button class="btn sm gh" data-a="tourReplay">${I('refresh',14)} ${L('আবার','Replay')}</button><button class="btn sm pri" data-a="tourNextJ">${L('পরের রোল','Next role')}</button><button class="btn sm gh" data-a="tourHub">${L('সব জার্নি','All journeys')}</button></div>`
   :`<div class="row sp"><b class="small">${N(TOUR.i+1)}. ${tx(st.t)}</b><span class="tiny mute">${N(TOUR.i+1)}/${N(n)}</span></div><p class="small sub" style="margin:4px 0 10px;line-height:1.45">${tx(st.d)}</p>
   <div class="row sp" style="gap:4px"><div class="row" style="gap:4px"><button class="tbtn" data-a="tourRestart" aria-label="Restart">${I('refresh',16)}</button><button class="tbtn" data-a="tourPrev" aria-label="Previous" ${TOUR.i===0?'disabled':''}>${I('back',16)}</button>
   <button class="tbtn main" data-a="tourPlay" aria-label="${TOUR.playing?'Pause':'Play'}">${I(TOUR.playing?'pause':'play',16)}</button><button class="tbtn" data-a="tourNext" aria-label="Next">${I('chev',16)}</button></div>
   <div class="row" style="gap:4px"><button class="tbtn txt" data-a="tourSpeed" aria-label="Speed">${N(TOUR.speed)}x</button><button class="tbtn" data-a="tourList" aria-label="Steps">${I('grid',15)}</button><button class="tbtn" data-a="tourMin" aria-label="Minimise">${I('dl',15)}</button><button class="tbtn" data-a="tourEnd" aria-label="Exit">${I('x',16)}</button></div></div>`}</div>`;
  layer.innerHTML=spot+card;TOUR.painted=TOUR.i;if(!TOUR.done)schedule();},el?260:0);}
Object.assign(A,{
 tourStart:d=>startTour(d.v,{marathon:d.m==='1'}), tourNext:()=>tourNext(), tourPrev:()=>tourPrev(), tourEnd:()=>endTour(),
 tourPlay:()=>{TOUR.playing=!TOUR.playing;paintTour();}, tourRestart:()=>startTour(TOUR.id,{marathon:TOUR.marathon}),
 tourSpeed:()=>{TOUR.speed=TOUR.speed>=2?1:TOUR.speed+0.5;paintTour();}, tourMin:()=>{TOUR.min=!TOUR.min;paintTour();},
 tourReplay:()=>startTour(TOUR.id), tourNextJ:()=>{const k=TOUR_ORDER.indexOf(TOUR.id);startTour(TOUR_ORDER[(k+1)%TOUR_ORDER.length]);},
 tourHub:()=>{document.getElementById('tourLayer')?.remove();TOUR=null;nav('tours');},
 tourList:()=>{TOUR.playing=false;paintTour();const tr=tourDef();sheet(`<h3>${tx(tr.t)}</h3><p class="small sub">${tx(tr.d)}</p>${tr.steps.map((s,i)=>`<div class="lr" data-a="tourJump" data-v="${i}" style="${i===TOUR.i?'background:rgba(60,180,231,.12);border-radius:12px;padding-left:6px':''}"><span class="ck ${i<TOUR.i?'done':''}">${i<TOUR.i?I('check',12):N(i+1)}</span><div style="flex:1"><b class="small">${tx(s.t)}</b><div class="tiny mute">${tx(s.d)}</div></div></div>`).join('')}`);},
 tourJump:d=>{closeSheet();TOUR.i=+d.v;TOUR.done=false;runStep();}
});
document.addEventListener('keydown',e=>{if(!TOUR||e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight')tourNext();else if(e.key==='ArrowLeft')tourPrev();else if(e.key===' '){e.preventDefault();A.tourPlay();}else if(e.key==='Escape')endTour();});
window.addEventListener('resize',()=>{if(TOUR)paintTour();});

 <div class="glass card" style="background:linear-gradient(130deg,rgba(244,121,32,.25),rgba(60,180,231,.2))"><h3>${L('রোলভিত্তিক শুরু থেকে শেষ জার্নি','Start-to-end journeys, role by role')}</h3><p class="small sub" style="margin:4px 0 10px">${L(`${N(TOURS.length)}টি জার্নি, ${N(TOURS.reduce((a,t)=>a+t.steps.length,0))}টি ধাপ। প্রতিটি ধাপ আসল স্ক্রিনে গিয়ে কাজটি করে দেখায়। নিয়ন্ত্রণ: চালু/বিরতি, আগের/পরের, গতি, ধাপের তালিকা, ছোট করা ও বের হওয়া। কীবোর্ড: ← → স্পেস Esc।`,`${TOURS.length} journeys, ${TOURS.reduce((a,t)=>a+t.steps.length,0)} steps. Each step opens the real screen and performs the action. Controls: play/pause, back/next, speed, step list, minimise and exit. Keyboard: ← → Space Esc.`)}</p>
 <button class="btn grad full" data-a="tourStart" data-v="guest" data-m="1">${I('play',18)} ${L('সম্পূর্ণ প্ল্যাটফর্ম ট্যুর (সব রোল)','Full platform tour (all roles)')}</button><p class="tiny mute center" style="margin:6px 0 0">${L('প্রতিটি জার্নি তাজা ডেমো ডেটা দিয়ে শুরু হয়','Each journey starts from fresh demo data')}</p></div>
 ${TOURS.map(t=>`<div class="glass card row" style="align-items:flex-start"><div class="facet" style="width:46px;height:46px;border-radius:16px;background:${t.col}">${I(t.ico,22)}</div><div style="flex:1"><h4>${tx(t.t)}</h4><p class="tiny mute" style="margin:2px 0 8px">${tx(t.d)}</p><div class="row" style="gap:6px"><span class="tag">${N(t.steps.length)} ${L('ধাপ','steps')}</span><span class="tag">~${N(Math.ceil(t.steps.length*5.5/60))} ${L('মিনিট','min')}</span>${t.uid?`<span class="tag info">${esc(U(t.uid)?.name.split(' ')[0]||'')}</span>`:''}</div></div><button class="btn sm pri" data-a="tourStart" data-v="${t.id}">${I('play',14)} ${L('শুরু','Start')}</button></div>`).join('')}`};
/* entry points */
const _homeV2=R.home.v;R.home.v=p=>_homeV2(p).replace('<!--TOUR-->','').replace(`<div class="sec"><h3>${L('জনপ্রিয় কোর্স','Popular courses')}</h3>`,`<div class="glass card row" data-a="go" data-r="tours" style="cursor:pointer;background:linear-gradient(120deg,rgba(30,58,95,.92),rgba(45,127,193,.85));color:#fff;border-color:transparent"><div class="facet" style="background:var(--grad)">${I('play',24)}</div><div style="flex:1"><h4 style="color:#fff">${L('গাইডেড ডেমো','Guided demo')}</h4><p class="tiny" style="margin:2px 0 0;opacity:.85">${L(`${N(TOURS.length)}টি রোলভিত্তিক জার্নি — শুরু থেকে শেষ`,`${TOURS.length} role-based journeys — start to end`)}</p></div>${I('chev',18)}</div><div class="sec"><h3>${L('জনপ্রিয় কোর্স','Popular courses')}</h3>`);
const _loginV=R.login.v;R.login.v=p=>_loginV(p).replace(`<div class="glass card" style="margin-top:10px"><div class="row sp"><h4>`,`<button class="btn gh full" style="margin-top:10px" data-a="go" data-r="tours">${I('play',16)} ${L('গাইডেড ডেমো দেখুন','Watch the guided demo')}</button><div class="glass card" style="margin-top:10px"><div class="row sp"><h4>`);
const _profV2=R.profile.v;R.profile.v=p=>_profV2(p).replace(mItem('go','cog',L('সেটিংস','Settings'),'','data-r="settings"'),mItem('go','play',L('গাইডেড ডেমো','Guided demo'),'','data-r="tours"')+mItem('go','cog',L('সেটিংস','Settings'),'','data-r="settings"'));
const _rail=renderRail;renderRail=function(){_rail();if(!railEl)return;railEl.insertAdjacentHTML('afterbegin','');const box=document.createElement('div');box.className='glass';
 box.innerHTML=`<b class="small">${L('গাইডেড ডেমো','Guided demo')}</b><p style="margin:4px 0 10px">${TOUR?L(`চলছে: ${tx(tourDef().t)}`,`Playing: ${tx(tourDef().t)}`):L('রোল বেছে নিয়ে শুরু থেকে শেষ দেখুন','Pick a role and watch it end to end')}</p><button class="btn grad sm full" data-a="tourStart" data-v="guest" data-m="1">${I('play',14)} ${L('সম্পূর্ণ ট্যুর','Full tour')}</button><div class="col" style="gap:5px;margin-top:8px">${TOURS.map(t=>`<button class="chip ${TOUR&&TOUR.id===t.id?'on':''}" style="justify-content:flex-start" data-a="tourStart" data-v="${t.id}"><span class="dot" style="background:${t.col}"></span>${tx(t.t)}</button>`).join('')}</div>`;
 railEl.insertBefore(box,railEl.children[1]||null);};

document.addEventListener('click',e=>{if(!TOUR||!TOUR.playing)return;if(e.target.closest('#tourLayer,.rail'))return;if(e.target.closest('#app')){TOUR.playing=false;clearTimeout(TOUR.timer);setTimeout(paintTour,350);}},true);

window.BF={tour:()=>TOUR,go:(n,p)=>go(n,p||{}),A:()=>A,cur:()=>cur(),S:()=>S,pay:()=>PAY,setPayTotal:v=>{PAY.total=v;}};
boot();

})();</script></body></html>
